name: Sync LinkedIn

on:
  schedule:
    # 06:00 UTC every Sunday
    - cron: "0 6 * * 0"
  # Manual run button in the Actions tab
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pull profile from Proxycurl
        run: npm run sync:linkedin
        env:
          LINKEDIN_PROFILE_URL: ${{ secrets.LINKEDIN_PROFILE_URL }}
          PROXYCURL_API_KEY:    ${{ secrets.PROXYCURL_API_KEY }}

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/linkedin.json; then
            echo "No changes to data/linkedin.json."
            exit 0
          fi
          git config user.name  "linkedin-sync-bot"
          git config user.email "linkedin-sync-bot@users.noreply.github.com"
          git add data/linkedin.json
          git commit -m "chore: weekly LinkedIn sync"
          git push
